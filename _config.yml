title: Christianity in 24 Hours
description: The Bible tells one story. Humanity growing up.
theme: jekyll-theme-minimal
plugins:
  - jekyll-relative-links

relative_links:
  enabled: true

defaults:
  - scope:
      path: "manuscript"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"

exclude:
  - reference
  - OUTLINE.md
  - README.md
  - manuscript/Book.txt
  - manuscript/SAVED.md
